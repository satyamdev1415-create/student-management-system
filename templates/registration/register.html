<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Student Management System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-md-7 col-lg-5">

                <!-- Register Card -->
                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <!-- Heading -->
                        <div class="text-center mb-4">

                            <div class="fs-1 mb-2">
                                🎓
                            </div>

                            <h2 class="fw-bold mb-1">
                                Create Account
                            </h2>

                            <p class="text-muted mb-0">
                                Join the Student Management System
                            </p>

                        </div>


                        <!-- Error Message -->
                        {% if error %}

                            <div class="alert alert-danger">

                                <strong>Registration failed!</strong>
                                <br>

                                {{ error }}

                            </div>

                        {% endif %}


                        <!-- Register Form -->
                        <form method="POST">

                            {% csrf_token %}


                            <!-- Username -->
                            <div class="mb-3">

                                <label
                                    for="username"
                                    class="form-label fw-semibold"
                                >
                                    Username
                                </label>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter your username"
                                    required
                                >

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label fw-semibold"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Create a password"
                                    required
                                >

                            </div>


                            <!-- Confirm Password -->
                            <div class="mb-4">

                                <label
                                    for="confirm_password"
                                    class="form-label fw-semibold"
                                >
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    id="confirm_password"
                                    name="confirm_password"
                                    class="form-control"
                                    placeholder="Confirm your password"
                                    required
                                >

                            </div>


                            <!-- Register Button -->
                            <button
                                type="submit"
                                class="btn btn-dark w-100 py-2"
                            >
                                🚀 Create Account
                            </button>

                        </form>


                        <!-- Login Link -->
                        <div class="text-center mt-4">

                            <p class="text-muted mb-0">

                                Already have an account?

                                <a
                                    href="{% url 'login' %}"
                                    class="text-decoration-none fw-semibold"
                                >
                                    Login
                                </a>

                            </p>

                        </div>

                    </div>

                </div>


                <!-- Footer -->
                <p class="text-center text-muted small mt-3">
                    © 2026 Student Management System
                </p>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
